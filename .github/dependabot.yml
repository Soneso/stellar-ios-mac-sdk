version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    groups:
      swift:
        patterns:
          - "*"
  - package-ecosystem: bundler
    directory: /tools/xdr-generator
    schedule:
      interval: monthly
    groups:
      bundler:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
