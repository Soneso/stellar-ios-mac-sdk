name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '16.0'
          - runner: macos-26
            xcode: '26.6'
          - runner: xcode-27
            xcode: '27.2'
            coverage: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version
          swift --version

      - name: Run unit tests with coverage
        if: matrix.coverage
        run: |
          swift test --filter stellarsdkUnitTests --enable-code-coverage

      - name: Run unit tests
        if: ${{ !matrix.coverage }}
        run: |
          swift test --filter stellarsdkUnitTests

      - name: Export coverage
        if: matrix.coverage
        run: |
          mkdir -p coverage
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -type f | head -1)
          TEST_BIN=$(find "$BIN_PATH" -name '*.xctest' -type d 2>/dev/null | head -1)
          if [ -n "$TEST_BIN" ]; then
            EXEC="$TEST_BIN/Contents/MacOS/$(basename "$TEST_BIN" .xctest)"
          else
            EXEC=$(find "$BIN_PATH" -name 'stellarsdkPackageTests' -type f | head -1)
          fi
          xcrun llvm-cov export \
            "$EXEC" \
            -instr-profile="$PROFDATA" \
            -format=lcov > coverage/lcov.info

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: true
          verbose: true

  agents-md-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the path checker's tests
        run: python3 .github/scripts/test_check_agents_md_paths.py

      - name: Check the paths AGENTS.md names
        run: python3 .github/scripts/check_agents_md_paths.py
